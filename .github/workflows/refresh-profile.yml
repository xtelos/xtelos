name: Refresh profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The panel is static copy now (the activity block that needed a
      # PROFILE_TOKEN to read private repos is gone), so the generator needs
      # no token or network and a normal night regenerates identical bytes
      # and commits nothing. The run is kept as a drift guard: if copy in
      # generate_profile.py is committed without regenerating, this commits
      # the matching SVGs and README hashes.
      - name: Generate profile SVGs
        run: python3 scripts/generate_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md belongs in this commit, not just the assets. The
          # generator stamps the <picture> URLs with a hash of each asset's
          # content to defeat client caching, so an asset committed without
          # its README leaves the page pointing at the previous hash and
          # every client keeps serving the copy it already has.
          git add assets/profile.svg assets/profile-narrow.svg README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh profile"
          git push
