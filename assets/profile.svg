<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1174" width="960" height="1174" role="img">
<style>
text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; }
.title { font-size: 13.1px; fill: #6b6d80; }

.cursor { animation: blink 1.1s steps(1, end) infinite; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1b1d29"/>
<stop offset="1" stop-color="#15161e"/>
</linearGradient>
<clipPath id="win"><rect x="1" y="1" width="958" height="1172" rx="11"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="959" height="1173" rx="11.5" fill="url(#bg)" stroke="#2a2b3a"/>
<g clip-path="url(#win)">
<rect x="1" y="1" width="958" height="35" fill="#1b1c26"/>
<line x1="1" y1="36" x2="959" y2="36" stroke="#2a2b3a" stroke-width="1"/>
</g>
<circle cx="24" cy="18.0" r="6" fill="#ff5f57"/><circle cx="44" cy="18.0" r="6" fill="#febc2e"/><circle cx="64" cy="18.0" r="6" fill="#28c840"/>
<text class="title" x="480.0" y="23.1" text-anchor="middle">dylan@xtelos: ~ · zsh</text>
<text x="24" y="67" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>whoami</tspan></text>
<text x="24" y="94" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">Dylan Fodor</tspan><tspan> · </tspan><tspan fill="#e6edf3">Full-Stack Developer</tspan><tspan> · </tspan><tspan fill="#8b8fa3">Software Consulting Services</tspan></text>
<text x="24" y="148" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>cat about.txt</tspan></text>
<text x="24" y="175" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">I build and modernize the software newspapers use to sell and produce advertising. I lean front-</tspan></text>
<text x="24" y="202" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">end but work the whole stack, and the work I&#x27;m proudest of is the load-bearing kind: two-factor</tspan></text>
<text x="24" y="229" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">auth, payment processing, and a generative-AI tool that makes print-ready ad artwork.</tspan></text>
<text x="24" y="256" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">Reliability first, because that&#x27;s the part people only notice when it&#x27;s missing.</tspan></text>
<text x="24" y="310" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>ls -l ~/tools</tspan></text>
<text x="24" y="337" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">argus       </tspan><tspan fill="#e6edf3">call/impact graph over a million-line legacy codebase, with cited file:line receipts</tspan></text>
<text x="24" y="364" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">aegis       </tspan><tspan fill="#e6edf3">build-trust engine that compiles on the real host and cannot report a false green</tspan></text>
<text x="24" y="391" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">iris        </tspan><tspan fill="#e6edf3">headless visual verification over CDP: a screenshot, a verdict, console errors</tspan></text>
<text x="24" y="418" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">demeter     </tspan><tspan fill="#e6edf3">dev-database harness that stands up, seeds, and tears down a stack on demand</tspan></text>
<text x="24" y="445" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">ariadne     </tspan><tspan fill="#e6edf3">long-effort tracker that reports the drift between its own claims and what git did</tspan></text>
<text x="24" y="472" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">delphi      </tspan><tspan fill="#e6edf3">personal knowledge engine: a linked note graph with scored recall across sessions</tspan></text>
<text x="24" y="499" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">momus       </tspan><tspan fill="#e6edf3">adversarial reviewer that assumes my change is broken and tries to prove it</tspan></text>
<text x="24" y="553" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>tail shipped.log</tspan></text>
<text x="24" y="580" xml:space="preserve" fill="#8b8fa3"><tspan fill="#ffa657">[auth]      </tspan><tspan fill="#e6edf3">Multi-method 2FA (TOTP, SMS, email, trusted devices) on 90+ newspaper sites</tspan></text>
<text x="24" y="607" xml:space="preserve" fill="#8b8fa3"><tspan fill="#ffa657">[payments]  </tspan><tspan fill="#e6edf3">Provider-agnostic payment layer (Stripe, Square) and a live processor migration</tspan></text>
<text x="24" y="634" xml:space="preserve" fill="#8b8fa3"><tspan fill="#ffa657">[genai]     </tspan><tspan fill="#e6edf3">Print-ready ad artwork from a text prompt: three image models behind one interface</tspan></text>
<text x="24" y="661" xml:space="preserve" fill="#8b8fa3"><tspan fill="#ffa657">[adtech]    </tspan><tspan fill="#e6edf3">Google Ad Manager line items, advertisers, and creatives straight from order entry</tspan></text>
<text x="24" y="688" xml:space="preserve" fill="#8b8fa3"><tspan fill="#ffa657">[solo]      </tspan><tspan fill="#e6edf3">Multi-tenant classified-ads marketplace, sole developer: ad builder to checkout</tspan></text>
<text x="24" y="742" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>tail activity.log</tspan></text>
<text x="24" y="769" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">merged, last 7d </tspan><tspan fill="#2a2b3a">······</tspan><tspan> </tspan><tspan fill="#e6edf3">153 pull requests</tspan></text>
<text x="24" y="796" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">merged, last 30d </tspan><tspan fill="#2a2b3a">·····</tspan><tspan> </tspan><tspan fill="#e6edf3">381 across 24 repositories</tspan></text>
<text x="24" y="823" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">30-day trend </tspan><tspan fill="#2a2b3a">·········</tspan><tspan> </tspan><tspan fill="#2a2b3a">▁▁▁</tspan><tspan fill="#39d353">▃▃▂▃</tspan><tspan fill="#2a2b3a">▁</tspan><tspan fill="#39d353">▂▃▆▃▃▅▃</tspan><tspan fill="#2a2b3a">▁▁</tspan><tspan fill="#39d353">▂▅▅▆▃▄▅▇▄█▄▂</tspan><tspan fill="#2a2b3a">▁</tspan></text>
<text x="24" y="850" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">active days </tspan><tspan fill="#2a2b3a">··········</tspan><tspan> </tspan><tspan fill="#e6edf3">23 of the last 30</tspan></text>
<text x="24" y="877" xml:space="preserve" fill="#8b8fa3"><tspan fill="#e6edf3">latest public work </tspan><tspan fill="#2a2b3a">···</tspan><tspan> </tspan><tspan fill="#8b8fa3">2026-07-31</tspan><tspan>  </tspan><tspan fill="#79c0ff">Cloud-City-Computing/c2</tspan></text>
<text x="24" y="931" xml:space="preserve" fill="#e6edf3"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan>cat stack.txt</tspan></text>
<text x="24" y="958" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">languages   </tspan><tspan fill="#e6edf3">JavaScript · TypeScript · Python · PHP · SQL</tspan></text>
<text x="24" y="985" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">frontend    </tspan><tspan fill="#e6edf3">React · Next.js · single-page apps that stay fast</tspan></text>
<text x="24" y="1012" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">backend     </tspan><tspan fill="#e6edf3">Node.js · Flask · Express · REST and JSON-RPC APIs</tspan></text>
<text x="24" y="1039" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">data        </tspan><tspan fill="#e6edf3">PostgreSQL · MySQL · MongoDB · Redis</tspan></text>
<text x="24" y="1066" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">infra       </tspan><tspan fill="#e6edf3">AWS · Docker · CI/CD · Linux</tspan></text>
<text x="24" y="1093" xml:space="preserve" fill="#8b8fa3"><tspan fill="#79c0ff">ai          </tspan><tspan fill="#e6edf3">LLM integration · image generation · speech to text</tspan></text>
<text x="24" y="1147" xml:space="preserve"><tspan fill="#7ee787">➜ </tspan><tspan fill="#79c0ff">~ </tspan><tspan class="cursor" fill="#e6edf3">▋</tspan></text>
</svg>
